<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Explore public repositories from the organization GitHub organization.">
  <title>organization · Repository Explorer</title>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.0",
        "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@19.2.0/client?external=react"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="m-0 bg-[#f6f7f2] font-sans text-[#182b24] antialiased selection:bg-emerald-200">
  <div id="root"><p class="mx-auto max-w-6xl px-6 py-12 text-sm text-[#64736b]">Loading Repository Explorer…</p></div>
  <noscript>This application requires JavaScript to display GitHub repositories.</noscript>
  <script type="text/tsx">
    import React, { useEffect, useMemo, useState } from 'react';
    import type { ReactNode } from 'react';
    import { createRoot } from 'react-dom/client';

    interface Repository {
      id: number;
      name: string;
      description: string | null;
      language: string | null;
      stargazers_count: number;
      forks_count: number;
      updated_at: string;
      archived: boolean;
      fork: boolean;
      private: boolean;
    }

    type SortOrder = 'updated' | 'stars' | 'name';
    interface RepositoryState {
      repositories: Repository[];
      loading: boolean;
      error: string;
    }

    const ORGANIZATION = 'organization';
    const ORGANIZATION_URL = `https://github.com/${ORGANIZATION}`;
    const API_URL = `https://api.github.com/orgs/${ORGANIZATION}/repos`;
    const number = new Intl.NumberFormat('en-US');
    const date = new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    const external = { target: '_blank', rel: 'noopener noreferrer' } as const;
    const focus = 'focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-emerald-600';
    const control = `h-12 w-full rounded-lg border border-[#dfe5de] bg-white px-3 text-sm ${focus}`;
    const badge = 'rounded-full border border-[#dfe5de] px-2 py-0.5 text-[10px] text-[#64736b]';

    function Message({ title, children }: { title: string; children: ReactNode }) {
      return (
        <div className="rounded-xl border border-dashed border-[#dfe5de] bg-white px-6 py-16 text-center">
          <h3 className="mb-2 text-lg font-semibold">{title}</h3>
          <p className="text-sm text-[#64736b]">{children}</p>
        </div>
      );
    }

    function RepositoryCard({ repo }: { repo: Repository }) {
      return (
        <article className="flex min-h-60 flex-col rounded-xl border border-[#dfe5de] bg-white p-6 transition hover:-translate-y-0.5 hover:border-[#9ab6a1] motion-reduce:transform-none motion-reduce:transition-none">
          <div className="flex items-start justify-between gap-3">
            <svg className="size-5 shrink-0 text-[#246c48]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" aria-hidden="true">
              <path d="M5 4h14v16H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 0v12h14M7 20v-4M8 8h7M8 11h5" />
            </svg>
            <div className="flex flex-wrap justify-end gap-1">
              {repo.archived && <span className={badge}>Archived</span>}
              {repo.fork && <span className={badge}>Fork</span>}
            </div>
          </div>
          <h3 className="mt-4 mb-2 text-lg leading-snug font-semibold tracking-tight [overflow-wrap:anywhere]">
            <a className={`hover:text-[#246c48] hover:underline hover:underline-offset-4 ${focus}`} href={`${ORGANIZATION_URL}/${encodeURIComponent(repo.name)}`} {...external}>{repo.name}</a>
          </h3>
          <p className="mb-6 text-sm leading-relaxed text-[#64736b] [overflow-wrap:anywhere]">{repo.description || 'No description provided yet.'}</p>
          <div className="mt-auto flex flex-wrap items-center gap-4 text-xs text-[#64736b]">
            {repo.language && <span className="flex items-center gap-1.5"><span className="size-2 rounded-full bg-[#819b86]" aria-hidden="true" />{repo.language}</span>}
            <span aria-label={`${repo.stargazers_count} stars`}>☆ {number.format(repo.stargazers_count)}</span>
            <span aria-label={`${repo.forks_count} forks`}>⑂ {number.format(repo.forks_count)}</span>
          </div>
          <p className="mt-3 border-t border-[#edf0ea] pt-3 text-[11px] text-[#64736b]">Updated <time dateTime={repo.updated_at}>{date.format(new Date(repo.updated_at))}</time></p>
        </article>
      );
    }

    function useRepositories(refreshKey: number): RepositoryState {
      const [state, setState] = useState<RepositoryState>({ repositories: [], loading: true, error: '' });

      useEffect(() => {
        let active = true;
        let timedOut = false;
        let timeout: ReturnType<typeof setTimeout> | undefined;
        const controller = new AbortController();

        async function load(): Promise<void> {
          setState({ repositories: [], loading: true, error: '' });
          const loaded: Repository[] = [];
          const seen = new Set<number>();
          try {
            let page = 1;
            let hasNext = true;
            while (hasNext) {
              timeout = setTimeout(() => { timedOut = true; controller.abort(); }, 20000);
              const response = await fetch(`${API_URL}?type=public&per_page=100&sort=updated&direction=desc&page=${page}`, {
                headers: { Accept: 'application/vnd.github+json' }, signal: controller.signal
              });
              if (!response.ok) {
                if (response.status === 404) throw new Error('The organization could not be found. Check its availability on GitHub.');
                if (response.status === 403 || response.status === 429) {
                  const reset = response.headers.get('x-ratelimit-reset');
                  const resetTime = reset && Number.isFinite(Number(reset))
                    ? new Date(Number(reset) * 1000).toLocaleTimeString('en-US') : '';
                  throw new Error(`GitHub has limited this request. ${resetTime ? `Try again after ${resetTime}, or later.` : 'Please try again later.'}`);
                }
                throw new Error(`GitHub API returned an error (HTTP ${response.status}).`);
              }
              const data: unknown = await response.json();
              clearTimeout(timeout);
              if (!Array.isArray(data)) throw new Error('GitHub returned an unexpected response.');
              if (!active) return;
              for (const repo of data as Repository[]) {
                if (!repo.private && !seen.has(repo.id)) {
                  seen.add(repo.id);
                  loaded.push(repo);
                }
              }
              setState({ repositories: [...loaded], loading: true, error: '' });
              hasNext = /rel="next"/.test(response.headers.get('link') || '');
              page += 1;
            }
            if (active) setState({ repositories: [...loaded], loading: false, error: '' });
          } catch (err: unknown) {
            if (!active) return;
            const message = timedOut ? 'The request timed out. Check your connection and try again.'
              : err instanceof TypeError ? 'Could not connect to GitHub. Check your connection and try again.'
              : err instanceof Error ? err.message : 'An unexpected error occurred. Please try again.';
            setState({ repositories: [...loaded], loading: false, error: message + (loaded.length ? ' Showing only the repositories loaded so far.' : '') });
          } finally {
            clearTimeout(timeout);
          }
        }

        void load();
        return () => { active = false; clearTimeout(timeout); controller.abort(); };
      }, [refreshKey]);

      return state;
    }

    function App() {
      const [refreshKey, setRefreshKey] = useState(0);
      const { repositories, loading, error } = useRepositories(refreshKey);
      const [query, setQuery] = useState('');
      const [language, setLanguage] = useState('');
      const [sort, setSort] = useState<SortOrder>('updated');
      const languages = useMemo(() => [...new Set(repositories.map(repo => repo.language).filter((value): value is string => Boolean(value)))].sort(), [repositories]);
      const stars = useMemo(() => repositories.reduce((sum, repo) => sum + repo.stargazers_count, 0), [repositories]);
      const filtered = useMemo(() => {
        const term = query.trim().toLowerCase();
        return repositories.filter(repo => (!language || repo.language === language)
          && `${repo.name} ${repo.description || ''}`.toLowerCase().includes(term))
          .sort((a, b) => {
            if (sort === 'stars') return b.stargazers_count - a.stargazers_count || a.name.localeCompare(b.name);
            if (sort === 'name') return a.name.localeCompare(b.name);
            return new Date(b.updated_at).getTime() - new Date(a.updated_at).getTime() || a.name.localeCompare(b.name);
          });
      }, [repositories, query, language, sort]);
      const statistics: [number, string][] = [[repositories.length, 'Public repositories'], [stars, 'Total stars'], [languages.length, 'Languages']];
      // Retain the selected language while refreshing or loading more pages.
      const languageOptions = [...new Set([...languages, ...(language ? [language] : [])])].sort();

      let emptyMessage: ReactNode;
      if (loading) emptyMessage = <Message title="Loading repositories">Fetching the latest projects from GitHub.</Message>;
      else if (error && !repositories.length) emptyMessage = <Message title="Unable to load repositories">Check the message above, then refresh to try again.</Message>;
      else if (query.trim() || language) emptyMessage = <Message title="No matching repositories">Try another search or change the language filter.</Message>;
      else emptyMessage = <Message title="No public repositories yet">This organization has no public repositories to display.</Message>;

      return (
        <>
          <header className="border-b border-[#dfe5de] bg-white/60">
            <nav className="mx-auto flex min-h-20 max-w-6xl items-center justify-between gap-4 px-5 sm:px-8" aria-label="Main navigation">
              <a className={`flex items-center gap-2 text-sm font-bold tracking-tight sm:gap-3 sm:text-base ${focus}`} href={ORGANIZATION_URL} {...external}>
                <span className="grid size-8 place-items-center rounded-lg bg-[#246c48] font-mono text-2xl text-white" aria-hidden="true">o</span>
                {ORGANIZATION}<span className="font-normal text-[#64736b]">/ repos</span>
              </a>
              <a className={`text-xs text-[#64736b] hover:text-[#246c48] sm:text-sm ${focus}`} href={ORGANIZATION_URL} {...external}>View on GitHub ↗</a>
            </nav>
          </header>
          <main className="mx-auto max-w-6xl px-5 sm:px-8">
            <section className="pt-12 pb-10 sm:pt-16" aria-labelledby="page-title">
              <h1 id="page-title" className="mt-4 mb-3 text-4xl leading-tight font-semibold tracking-[-0.045em] [overflow-wrap:anywhere] sm:text-6xl">Explore {ORGANIZATION}.</h1>
              <p className="max-w-xl text-sm leading-relaxed text-[#64736b] sm:text-base">Where ideas become code. Discover what we’re building, one repository at a time.</p>
              <a className={`mt-5 inline-block text-sm text-[#246c48] ${focus}`} href={ORGANIZATION_URL} {...external}>github.com/{ORGANIZATION} ↗</a>
              <div className="mt-8 flex flex-wrap gap-6 border-t border-[#dfe5de] pt-6 sm:gap-9" aria-label="Loaded public repository statistics">
                {statistics.map(([value, label]) => <div key={label} className="flex flex-col gap-0 sm:flex-row sm:items-baseline sm:gap-2"><strong className="text-2xl font-semibold tabular-nums">{loading && !repositories.length ? '—' : number.format(value)}</strong><span className="text-xs text-[#64736b]">{label}</span></div>)}
              </div>
            </section>
            <section aria-labelledby="repositories-title" aria-busy={loading}>
              <div className="mb-4 flex items-center justify-between gap-4">
                <h2 id="repositories-title" className="text-lg font-semibold tracking-tight">The repository collection</h2>
                <button className={`shrink-0 cursor-pointer rounded-lg border border-[#dfe5de] px-3 py-1.5 text-xs text-[#64736b] hover:bg-white disabled:cursor-wait disabled:opacity-50 ${focus}`} type="button" disabled={loading} onClick={() => setRefreshKey(key => key + 1)}>↻ Refresh</button>
              </div>
              <div className="mb-6 grid grid-cols-2 gap-2.5 md:grid-cols-[minmax(0,1fr)_170px_190px]">
                <div className="relative col-span-2 md:col-span-1">
                  <svg className="pointer-events-none absolute top-4 left-4 size-4 text-[#64736b]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
                  <label className="sr-only" htmlFor="search">Search repository names and descriptions</label>
                  <input className={`${control} pl-10`} id="search" type="search" placeholder="Find a repository…" autoComplete="off" value={query} onChange={event => setQuery(event.target.value)} />
                </div>
                <label className="sr-only" htmlFor="language">Filter by language</label>
                <select className={control} id="language" value={language} onChange={event => setLanguage(event.target.value)}><option value="">All languages</option>{languageOptions.map(value => <option key={value} value={value}>{value}</option>)}</select>
                <label className="sr-only" htmlFor="sort">Sort repositories</label>
                <select className={control} id="sort" value={sort} onChange={event => setSort(event.target.value as SortOrder)}><option value="updated">Recently updated</option><option value="stars">Most stars</option><option value="name">Name: A–Z</option></select>
              </div>
              <div className="mb-4 flex flex-wrap justify-between gap-x-4 gap-y-2 text-xs text-[#64736b]">
                <span role="status" aria-live="polite">{number.format(filtered.length)} shown / {number.format(repositories.length)} loaded{loading ? ' · Loading…' : ''}</span><span className="tracking-wider">PUBLIC REPOSITORIES</span>
              </div>
              {error && <div className="mb-5 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900" role="alert">{error}</div>}
              {filtered.length ? <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">{filtered.map(repo => <RepositoryCard key={repo.id} repo={repo} />)}</div> : emptyMessage}
            </section>
            <footer className="mt-12 flex flex-col justify-between gap-2 border-t border-[#dfe5de] pt-6 pb-8 text-xs text-[#64736b] sm:flex-row"><span>organization</span></footer>
          </main>
        </>
      );
    }

    const root = document.getElementById('root');
    if (!root) throw new Error('Application root not found.');
    createRoot(root).render(<App />);
  </script>
  <script type="module" src="https://esm.sh/tsx"></script>
</body>
</html>
